plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hans.android.adaptivekeyboard'
    compileSdk 34

    defaultConfig {
        applicationId 'com.hans.android.adaptivekeyboard'
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName '0.11.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
