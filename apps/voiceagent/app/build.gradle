plugins { id 'com.android.application' }
dependencies {
 implementation project(':modules:audio')
 implementation 'androidx.core:core:1.12.0'
 implementation 'com.google.android.material:material:1.12.0'
 implementation 'com.squareup.okhttp3:okhttp:4.12.0'
 testImplementation 'junit:junit:4.13.2'
 androidTestImplementation 'androidx.test.ext:junit:1.1.5'
 androidTestImplementation 'androidx.test:rules:1.5.0'
 androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
android {
 namespace 'myapp.app'
 compileSdk 34
 defaultConfig {
   applicationId 'com.multiverse.voiceclient'
   minSdk 24
   targetSdk 34
   versionCode 1
   versionName '0.1'
   testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
 }
 sourceSets {
   main {
     java.srcDir file('../../android03/app/src/main/java')
     res.srcDir file('../../android03/app/src/main/res')
   }
   debug { res.srcDir file('src/skin/res') }
   release { res.srcDir file('src/skin/res') }
   test { java.srcDir file('../../android03/app/src/test/java') }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildTypes { release { minifyEnabled false } }
 lint { disable 'GradleDependency' }
 packagingOptions { resources { excludes += ['META-INF/LGPL2.1'] } }
}
