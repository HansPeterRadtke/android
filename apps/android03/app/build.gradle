plugins {
    id 'com.android.application'
}

dependencies {
    implementation project(':modules:audio')
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

android {
    namespace 'myapp.app'
    compileSdk 34
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        def voiceAuthToken = System.getenv('VOICE_AGENT_AUTH_TOKEN') ?: ''
        def voiceAuthTokenFile = project.findProperty('voiceAgentAuthTokenFile')
        if (voiceAuthToken.isEmpty() && voiceAuthTokenFile != null) {
            voiceAuthToken = file(voiceAuthTokenFile.toString()).getText('UTF-8').trim()
        }
        def localVoiceCredential = file('/data/var/voice-agent-build/credential')
        if (voiceAuthToken.isEmpty() && localVoiceCredential.isFile()) {
            voiceAuthToken = localVoiceCredential.getText('UTF-8').trim()
        }
        buildConfigField 'String', 'VOICE_AUTH_TOKEN', '"' + voiceAuthToken.replace('\\', '\\\\').replace('\"', '\\"') + '"'
        applicationId "myapp.app"
        minSdk 24
        targetSdk 34
        versionCode 18
        versionName "1.7.10"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    lint {
        disable 'GradleDependency'
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/LGPL2.1']
        }
    }
}
